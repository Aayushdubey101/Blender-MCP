[project]
name = "blender-mcp-hyper3d"
version = "0.1.0"
description = "Hyper3D Rodin AI 3D generation plugin for Blender MCP."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.3.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.entry-points."blender_mcp.plugins"]
hyper3d = "blender_mcp_hyper3d:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_mcp_hyper3d"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
